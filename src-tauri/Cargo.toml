[package]
name = "pps-study"
version = "2.0.0"
description = "PPS Study — UW-Madison Psychology Lab"
authors = ["UW-Madison Psychology Lab"]
edition = "2021"

[lib]
name = "pps_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
